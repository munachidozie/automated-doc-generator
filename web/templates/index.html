<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Documentation Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Loading overlay */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #loading-overlay .spinner-border {
            width: 4rem;
            height: 4rem;
        }
        #loading-overlay .progress {
            width: 60%;
            max-width: 400px;
            margin-top: 20px;
        }
        #loading-overlay p {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
        </div>
        <p>⏳ Generating documentation... Please wait.</p>
    </div>

    <div class="container mt-5">
        <h1 class="text-center">📄 Automated Documentation Generator</h1>
        <p class="text-center text-muted">Generate structured documentation from your code using AI.</p>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form id="doc-form" action="/generate" method="post" enctype="multipart/form-data">
                            <!-- Input Type Selection -->
                            <div class="mb-3">
                                <label for="input_type" class="form-label">Input Source</label>
                                <select class="form-select" id="input_type" name="input_type" onchange="toggleInputFields()">
                                    <option value="paste">Paste Code</option>
                                    <option value="file">Upload File(s)</option>
                                    <option value="github">GitHub URL</option>
                                </select>
                            </div>

                            <!-- Paste Code -->
                            <div id="paste_input" class="mb-3">
                                <label for="code" class="form-label">Paste your code</label>
                                <textarea class="form-control" id="code" name="code" rows="10" placeholder="Paste your code here..."></textarea>
                            </div>

                            <!-- File Upload -->
                            <div id="file_input" class="mb-3" style="display:none;">
                                <label for="files" class="form-label">Select files</label>
                                <input class="form-control" type="file" id="files" name="files" multiple accept=".py,.js,.ts,.java,.c,.cpp,.go,.rs,.rb,.php,.swift,.kt,.scala,.cs,.sh,.pl,.pm,.lua,.r,.m,.groovy,.dart,.jl,.ex,.exs">
                            </div>

                            <!-- GitHub URL -->
                            <div id="github_input" class="mb-3" style="display:none;">
                                <label for="github_url" class="form-label">GitHub Repository URL</label>
                                <input class="form-control" type="url" id="github_url" name="github_url" placeholder="https://github.com/user/repo">
                                <div class="mt-2">
                                    <label for="branch" class="form-label">Branch (optional)</label>
                                    <input class="form-control" type="text" id="branch" name="branch" placeholder="main">
                                </div>
                            </div>

                            <!-- Metadata -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="title" class="form-label">Project Title</label>
                                    <input class="form-control" type="text" id="title" name="title" placeholder="My Project">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="author" class="form-label">Author</label>
                                    <input class="form-control" type="text" id="author" name="author" placeholder="Your Name">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="version" class="form-label">Version</label>
                                    <input class="form-control" type="text" id="version" name="version" placeholder="1.0.0">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="language" class="form-label">Language (auto-detect if empty)</label>
                                    <input class="form-control" type="text" id="language" name="language" placeholder="Python">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="context" class="form-label">Context (optional)</label>
                                <textarea class="form-control" id="context" name="context" rows="2" placeholder="e.g., A REST API for task management"></textarea>
                            </div>

                            <!-- Output Format -->
                            <div class="mb-3">
                                <label class="form-label">Output Format</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="format" id="format_md" value="md" checked>
                                        <label class="form-check-label" for="format_md">Markdown</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="format" id="format_html" value="html">
                                        <label class="form-check-label" for="format_html">HTML</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="format" id="format_json" value="json">
                                        <label class="form-check-label" for="format_json">JSON</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="format" id="format_all" value="all">
                                        <label class="form-check-label" for="format_all">All formats</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="submit-btn">Generate Documentation</button>
                        </form>
                        {% if error %}
                            <div class="alert alert-danger mt-3">{{ error }}</div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleInputFields() {
            const selected = document.getElementById('input_type').value;
            document.getElementById('paste_input').style.display = selected === 'paste' ? 'block' : 'none';
            document.getElementById('file_input').style.display = selected === 'file' ? 'block' : 'none';
            document.getElementById('github_input').style.display = selected === 'github' ? 'block' : 'none';
        }
        toggleInputFields();

        // Show loading overlay on form submit
        document.getElementById('doc-form').addEventListener('submit', function() {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').innerHTML = '⏳ Generating...';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
